services:
  - type: web
    name: qabot-backend
    env: python
    buildCommand: pip install -r qabot/backend/requirements.txt
    # Single worker: the loaded document lives in process memory, so multiple
    # workers would each see a different (or no) document.
    startCommand: cd qabot/backend && gunicorn -w 1 --timeout 180 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:$PORT main:app
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11"

  - type: static
    name: qabot-frontend
    buildCommand: cd qabot/frontend/frontend && npm install && npm run build
    staticPublishPath: qabot/frontend/frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://qabot-backend.onrender.com
