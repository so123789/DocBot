services:
  - type: web
    name: qabot-backend
    env: python
    buildCommand: pip install -r qabot/backend/requirements.txt
    startCommand: cd qabot/backend && gunicorn -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:$PORT main:app
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11"

  - type: static
    name: qabot-frontend
    buildCommand: cd qabot/frontend/frontend && npm install && npm run build
    staticPublishPath: qabot/frontend/frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://qabot-backend.onrender.com
