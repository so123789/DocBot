services:
  - type: web
    name: qabot-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn -w 4 -k uvicorn.workers.UvicornWorker main:app
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11"

  - type: static
    name: qabot-frontend
    buildCommand: cd frontend/frontend && npm install && npm run build
    staticPublishPath: frontend/frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://qabot-backend.onrender.com
